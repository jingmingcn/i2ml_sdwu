  <text x="120" y="95" fill="#8c8c8c" font-size="11" text-anchor="middle">eps</text>
  <!-- core points (filled dark) -->
  <g fill="#551645"><circle cx="120" cy="130" r="7"/><circle cx="100" cy="115" r="7"/><circle cx="140" cy="120" r="7"/><circle cx="110" cy="150" r="7"/><circle cx="135" cy="150" r="7"/></g>
  <!-- boundary (outline) -->
  <circle cx="160" cy="155" r="7" fill="#af79a1"/><circle cx="85" cy="150" r="7" fill="#af79a1"/>
  <!-- noise (red) -->
  <circle cx="270" cy="60" r="7" fill="#b00"/><circle cx="290" cy="200" r="7" fill="#b00"/>
  <!-- legend -->
  <circle cx="40" cy="225" r="6" fill="#551645"/><text x="52" y="229" font-size="11" fill="#211112">core</text>
  <circle cx="120" cy="225" r="6" fill="#af79a1"/><text x="132" y="229" font-size="11" fill="#211112">boundary</text>
  <circle cx="225" cy="225" r="6" fill="#b00"/><text x="237" y="229" font-size="11" fill="#211112">noise (-1)</text>
</svg>
