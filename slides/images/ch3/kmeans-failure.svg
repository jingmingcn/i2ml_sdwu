  <!-- upper moon -->
  <g>
    <circle cx="80" cy="120" r="5" fill="#954c81"/><circle cx="105" cy="100" r="5" fill="#954c81"/><circle cx="135" cy="90" r="5" fill="#954c81"/><circle cx="165" cy="95" r="5" fill="#627a1f"/><circle cx="195" cy="105" r="5" fill="#627a1f"/>
  </g>
  <!-- lower moon -->
  <g>
    <circle cx="160" cy="150" r="5" fill="#954c81"/><circle cx="190" cy="160" r="5" fill="#954c81"/><circle cx="220" cy="170" r="5" fill="#627a1f"/><circle cx="250" cy="165" r="5" fill="#627a1f"/><circle cx="280" cy="150" r="5" fill="#627a1f"/>
  </g>
  <!-- straight split line -->
  <line x1="175" y1="60" x2="175" y2="210" stroke="#b00" stroke-dasharray="5" stroke-width="2"/>
