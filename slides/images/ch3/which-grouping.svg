<?xml version="1.0" encoding="UTF-8"?>
<svg width="420" height="300" viewBox="0 0 420 300" xmlns="http://www.w3.org/2000/svg">
  <text x="210" y="24" fill="#551645" font-size="15" text-anchor="middle" font-weight="bold">Which grouping is "correct"?</text>
  <!-- option A: by color -->
  <rect x="20" y="40" width="180" height="230" rx="8" fill="#f2e9ef" stroke="#954c81"/>
  <text x="110" y="60" fill="#551645" font-size="13" text-anchor="middle">by shape</text>
  <circle cx="70" cy="110" r="12" fill="#954c81"/><circle cx="110" cy="130" r="12" fill="#954c81"/><circle cx="90" cy="160" r="12" fill="#954c81"/>
  <rect x="120" y="195" width="22" height="22" fill="#627a1f"/><rect x="75" y="210" width="22" height="22" fill="#627a1f"/><rect x="100" y="235" width="22" height="22" fill="#627a1f"/>
  <!-- option B: by color -->
  <rect x="220" y="40" width="180" height="230" rx="8" fill="#f2e9ef" stroke="#954c81"/>
  <text x="310" y="60" fill="#551645" font-size="13" text-anchor="middle">by color</text>
  <circle cx="270" cy="110" r="12" fill="#954c81"/><rect x="300" y="120" width="22" height="22" fill="#954c81"/><circle cx="280" cy="160" r="12" fill="#954c81"/>
  <rect x="320" y="195" width="22" height="22" fill="#627a1f"/><circle cx="275" cy="220" r="12" fill="#627a1f"/><rect x="305" y="238" width="22" height="22" fill="#627a1f"/>
  <text x="210" y="292" fill="#8c8c8c" font-size="12" text-anchor="middle">Both are valid — only you know which you wanted.</text>
</svg>
