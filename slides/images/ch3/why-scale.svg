<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="230" viewBox="0 0 900 230" xmlns="http://www.w3.org/2000/svg">
  <!-- before -->
  <text x="150" y="22" fill="#551645" font-size="16" text-anchor="middle" font-weight="bold">Before: unequal ranges</text>
  <line x1="40" y1="190" x2="300" y2="190" stroke="#211112" stroke-width="1.5"/>
  <line x1="40" y1="190" x2="40" y2="50" stroke="#211112" stroke-width="1.5"/>
  <text x="170" y="212" fill="#8c8c8c" font-size="12">feature A  (0–1000)</text>
  <text x="18" y="120" fill="#8c8c8c" font-size="12" transform="rotate(-90 18 120)">B (0–1)</text>
  <ellipse cx="200" cy="150" rx="90" ry="14" fill="#954c81" opacity="0.55"/>
  <text x="300" y="150" fill="#551645" font-size="12">stretched</text>
  <!-- arrow -->
  <path d="M360 120 L440 120" stroke="#627a1f" stroke-width="3" fill="none" marker-end="url(#ar)"/>
  <defs><marker id="ar" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#627a1f"/></marker></defs>
  <text x="400" y="110" fill="#627a1f" font-size="13" text-anchor="middle">scale</text>
  <!-- after -->
  <text x="650" y="22" fill="#551645" font-size="16" text-anchor="middle" font-weight="bold">After: comparable ranges</text>
  <line x1="540" y1="190" x2="800" y2="190" stroke="#211112" stroke-width="1.5"/>
  <line x1="540" y1="190" x2="540" y2="50" stroke="#211112" stroke-width="1.5"/>
  <text x="640" y="212" fill="#8c8c8c" font-size="12">feature A</text>
  <text x="518" y="120" fill="#8c8c8c" font-size="12" transform="rotate(-90 518 120)">B</text>
  <circle cx="670" cy="120" r="55" fill="#954c81" opacity="0.45"/>
  <text x="730" y="120" fill="#551645" font-size="12">balanced</text>
</svg>
